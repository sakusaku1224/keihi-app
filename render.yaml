databases:
  - name: keihi-app-db
    databaseName: keihi_app_production
    user: keihi_app
    plan: free

services:
  - type: web
    name: keihi-app
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keihi-app-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
